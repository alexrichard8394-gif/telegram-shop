<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTAIL VAPE Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #0088cc;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #242424);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }
        .price {
            font-weight: bold;
            color: #4cd964;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>💨 NTAIL VAPE</h1>

    <div class="products">
        <div class="card">
            <h3>Жидкость Chaser 30ml</h3>
            <p class="price">250 грн</p>
            <button onclick="buy('Жидкость Chaser 30ml', 250)">Заказать</button>
        </div>
        <div class="card">
            <h3>Elf Bar 1500</h3>
            <p class="price">350 грн</p>
            <button onclick="buy('Elf Bar 1500', 350)">Заказать</button>
        </div>
        <div class="card">
            <h3>Под-система Vaporesso</h3>
            <p class="price">850 грн</p>
            <button onclick="buy('Под-система Vaporesso', 850)">Заказать</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function buy(item, price) {
            tg.sendData(JSON.stringify({product: item, price: price}));
        }
    </script>
</body>
</html>
